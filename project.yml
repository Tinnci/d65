name: D65
options:
  bundleIdPrefix: dev.tinnci
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"

packages:
  D65:
    path: .

targets:
  D65Mac:
    type: application
    platform: macOS
    sources:
      - path: Apps/D65Mac
    dependencies:
      - package: D65
        product: D65Core
      - package: D65
        product: D65Display
      - package: D65
        product: D65Calibration
      - package: D65
        product: D65MacRuntime
      - package: D65
        product: D65Link
    info:
      path: Apps/D65Mac/Info.plist
      properties:
        CFBundleDisplayName: D65
        D65SoftwareRevision: unknown
        CFBundleShortVersionString: "0.0.0" # stamped from the latest v* tag by scripts/stamp-revision.sh
        LSApplicationCategoryType: public.app-category.utilities
        LSUIElement: true
        NSLocalNetworkUsageDescription: D65 finds your iPhone probe on the local network.
        NSBonjourServices:
          - _d65._tcp
    postBuildScripts:
      - name: Stamp version and source revision
        script: sh "$SRCROOT/scripts/stamp-revision.sh"
        basedOnDependencyAnalysis: false
        inputFiles:
          - "$(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)"
    settings:
      base:
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        PRODUCT_BUNDLE_IDENTIFIER: dev.tinnci.d65
        SWIFT_VERSION: "5.0"
        # Icons and colours are generated by scripts/make-icons.swift.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic

  D65Probe:
    type: application
    platform: iOS
    sources:
      - path: Apps/D65Probe
      # Private ALS reader: a directory that exists only in a local checkout (local/ is git-ignored).
      # Listing the directory, not its files, keeps a clean clone buildable: XcodeGen expands it at
      # generation time, so when it is missing the target simply has no sensor sources.
      - path: local/probe-sensor
        optional: true
    dependencies:
      - package: D65
        product: D65Core
      - package: D65
        product: D65Link
      - package: D65
        product: D65Measurement
      - package: D65
        product: D65ProbeSupport
    info:
      path: Apps/D65Probe/Info.plist
      properties:
        CFBundleDisplayName: D65 Probe
        CFBundleShortVersionString: "0.0.0" # stamped from the latest v* tag by scripts/stamp-revision.sh
        D65SoftwareRevision: unknown
        UILaunchScreen:
          UIColorName: LaunchBackground
        NSLocalNetworkUsageDescription: D65 Probe sends measurements to the Mac on your local network.
        NSMotionUsageDescription: D65 Probe checks that the phone is still while it measures.
        NSCameraUsageDescription: Optional TrueDepth alignment estimates distance and tilt before you press the phone against the display.
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSBonjourServices:
          - _d65._tcp
    postBuildScripts:
      - name: Stamp version and source revision
        script: sh "$SRCROOT/scripts/stamp-revision.sh"
        basedOnDependencyAnalysis: false
        inputFiles:
          - "$(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.tinnci.d65.probe
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
