<title id="t">Primaries measured by the iPhone ambient-light sensor</title><desc id="d">CIE 1931 xy. The HAN K27's measured red, green and blue against the sRGB and Display P3 gamuts. Red and blue land near sRGB; green reads less saturated than sRGB green.</desc>
