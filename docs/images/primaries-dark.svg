<text x="558.0" y="150.0" font-size="12" fill="#a8a8a8" text-anchor="start" font-weight="400" >measured (§14)</text>
<line x1="520.0" y1="172.0" x2="548.0" y2="172.0" stroke="#7a7a7a" stroke-width="1" stroke-dasharray="5 4"/>
<text x="558.0" y="176.0" font-size="12" fill="#a8a8a8" text-anchor="start" font-weight="400" >sRGB</text>
<line x1="520.0" y1="198.0" x2="548.0" y2="198.0" stroke="#7a7a7a" stroke-width="1" stroke-dasharray="2 4"/>
<text x="558.0" y="202.0" font-size="12" fill="#a8a8a8" text-anchor="start" font-weight="400" >Display P3</text>
<text x="520.0" y="262.0" font-size="11.5" fill="#7a7a7a" text-anchor="start" font-weight="400" >Red and blue land near sRGB.</text>
<text x="520.0" y="280.0" font-size="11.5" fill="#7a7a7a" text-anchor="start" font-weight="400" >Green reads less saturated than</text>
<text x="520.0" y="298.0" font-size="11.5" fill="#7a7a7a" text-anchor="start" font-weight="400" >sRGB green.</text>
<text x="520.0" y="316.0" font-size="11.5" fill="#7a7a7a" text-anchor="start" font-weight="400" ></text>
<text x="520.0" y="334.0" font-size="11.5" fill="#7a7a7a" text-anchor="start" font-weight="400" >The ALS is uncalibrated, so treat</text>
<text x="520.0" y="352.0" font-size="11.5" fill="#7a7a7a" text-anchor="start" font-weight="400" >these as indicative. D65 corrects</text>
<text x="520.0" y="370.0" font-size="11.5" fill="#7a7a7a" text-anchor="start" font-weight="400" >white only; a diagonal gain cannot</text>
<text x="520.0" y="388.0" font-size="11.5" fill="#7a7a7a" text-anchor="start" font-weight="400" >move primaries.</text>
