name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  package:
    name: Package, CLI and tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Validate official CIE datasets
        run: python3 scripts/check_cie_data.py

      - name: Build
        run: swift build

      - name: Self-test
        run: swift run d65 selftest

      - name: Unit tests
        run: swift test

  windows:
    name: Windows host
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Swift
        uses: compnerd/gha-setup-swift@main
        with:
          branch: swift-6.1.2-release
          tag: 6.1.2-RELEASE

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Self-test
        run: swift run d65 selftest

      - name: Unit tests
        run: swift test

      # The hosted runner has one virtual display, which is enough to exercise the Win32 paths.
      - name: List displays, read a gamma ramp, write a neutral one
        run: |
          swift run d65 display list
          swift run d65 display probe
          swift run d65 display reset
          swift run d65 display probe

      - name: Serve smoke test (listener starts and accepts a connection)
        run: |
          $server = Start-Process -FilePath .build\debug\d65.exe -ArgumentList serve -PassThru -NoNewWindow `
            -RedirectStandardOutput serve.log -RedirectStandardError serve.err
          Start-Sleep -Seconds 5
          $accepted = (Test-NetConnection -ComputerName 127.0.0.1 -Port 50515).TcpTestSucceeded
          Stop-Process -Id $server.Id
          Get-Content serve.log, serve.err
          if (-not $accepted) { exit 1 }

  apps:
    name: Mac app and iPhone probe
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags and history feed the version stamp

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      # Unsigned builds catch app-only compile errors.
      - name: Build D65Mac
        run: xcodebuild -project D65.xcodeproj -scheme D65Mac -configuration Debug -destination 'generic/platform=macOS' CODE_SIGNING_ALLOWED=NO build

      - name: Build D65Probe
        run: xcodebuild -project D65.xcodeproj -scheme D65Probe -configuration Debug -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build
