name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  package:
    name: Package, CLI and tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Validate official CIE datasets
        run: python3 scripts/check_cie_data.py

      - name: Build
        run: swift build

      - name: Self-test
        run: swift run d65 selftest

      - name: Unit tests
        run: swift test

  apps:
    name: Mac app and iPhone probe
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags and history feed the version stamp

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      # Unsigned builds catch app-only compile errors. The probe builds without the private sensor
      # sources (they live in the git-ignored local/), exactly as a clean clone does.
      - name: Build D65Mac
        run: xcodebuild -project D65.xcodeproj -scheme D65Mac -configuration Debug -destination 'generic/platform=macOS' CODE_SIGNING_ALLOWED=NO build

      - name: Build D65Probe
        run: xcodebuild -project D65.xcodeproj -scheme D65Probe -configuration Debug -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build
